            tar -cJvf vmlinux-d1xks.tar.xz "$VMLINUX"
            ls -lh vmlinux-d1xks.tar.xz
          else
            echo "vmlinux not found - skipping"
          fi
      - name: Upload vmlinux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-d1xks
          path: vmlinux-d1xks.tar.xz
          if-no-files-found: warn
          retention-days: 7
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1xks
          path: build/out/d1xks/*.zip
          if-no-files-found: error

  build_d2s:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2s' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.FCK_SUBMODULES }}
      - name: Build for d2s
        env:
          KSU_NEXT_VERSION: ${{ needs.setup.outputs.ksu_commits }}
