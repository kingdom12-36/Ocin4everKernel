name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build (leave empty to build all)"
        required: false
        default: "all"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

permissions:
  contents: write

env:
  # إجبار المترجم على إيقاف التجميع فوراً عند اكتشاف مؤشرات غير آمنة أو قيم إرجاع مفقودة
  KCFLAGS: "-Werror=return-type -Werror=uninitialized -Werror=array-bounds -Werror=implicit-function-declaration"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should_build_all: ${{ github.event.inputs.model == 'all' }}
      ksu_tag: ${{ steps.ksu_version.outputs.tag }}
      build_date: ${{ steps.ksu_version.outputs.date }}
      ksu_commits: ${{ steps.ksu_version.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig sparse
      - name: Set should_build_all output
        run: echo "should_build_all=${{ github.event.inputs.model == 'all' }}" >> $GITHUB_OUTPUT
      - name: Resolve pinned KernelSU-Next version
        id: ksu_version
        run: |
          cd KernelSU-Next
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo unknown)
          SHA=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT
          echo "commits=$COMMIT_COUNT" >> $GITHUB_OUTPUT

  build_d1:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd1' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Inject Static Analysis & Strict Debug Configs
        run: |
          DEFCONFIG="arch/arm64/configs/exynos9820-d1_defconfig"
          echo "CONFIG_DEBUG_BUGVERBOSE=y" >> $DEFCONFIG || true
          echo "CONFIG_PANIC_ON_OOPS=y" >> $DEFCONFIG || true
          echo "CONFIG_FRAME_POINTER=y" >> $DEFCONFIG || true
          echo "CONFIG_DEBUG_SECTION_MISMATCH=y" >> $DEFCONFIG || true
      - name: Build for d1
        run: ./workflows.sh -m d1 -k Y -r N
      - name: Verify & Package Debug Artifacts
        run: |
          test -f build/out/d1/boot.img || { echo "boot.img missing"; exit 1; }
          find . -name "vmlinux" -exec cp {} build/out/d1/vmlinux \;
          find . -name "System.map" -exec cp {} build/out/d1/System.map \;
          cd build/out/d1 && zip -9 debug-symbols-d1.zip vmlinux System.map
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1
          path: build/out/d1/*.zip
          if-no-files-found: error

  build_d1xks:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd1xks' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Inject Static Analysis & Strict Debug Configs
        run: |
          DEFCONFIG="arch/arm64/configs/exynos9820-d1xks_defconfig"
          echo "CONFIG_DEBUG_BUGVERBOSE=y" >> $DEFCONFIG || true
          echo "CONFIG_PANIC_ON_OOPS=y" >> $DEFCONFIG || true
          echo "CONFIG_FRAME_POINTER=y" >> $DEFCONFIG || true
          echo "CONFIG_DEBUG_SECTION_MISMATCH=y" >> $DEFCONFIG || true
      - name: Build for d1xks
        run: ./workflows.sh -m d1xks -k y -r N
      - name: Verify & Package Debug Artifacts
        run: |
          test -f build/out/d1xks/boot.img || { echo "boot.img missing"; exit 1; }
          find . -name "vmlinux" -exec cp {} build/out/d1xks/vmlinux \;
          find . -name "System.map" -exec cp {} build/out/d1xks/System.map \;
          cd build/out/d1xks && zip -9 debug-symbols-d1xks.zip vmlinux System.map
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1xks
          path: build/out/d1xks/*.zip
          if-no-files-found: error

  build_d2s:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2s' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.FCK_SUBMODULES }}
          fetch-depth: 0
      - name: Inject Static Analysis & Strict Debug Configs
        run: |
          DEFCONFIG="arch/arm64/configs/exynos9820-d2s_defconfig"
          echo "CONFIG_DEBUG_BUGVERBOSE=y" >> $DEFCONFIG || true
          echo "CONFIG_PANIC_ON_OOPS=y" >> $DEFCONFIG || true
          echo "CONFIG_FRAME_POINTER=y" >> $DEFCONFIG || true
          echo "CONFIG_DEBUG_SECTION_MISMATCH=y" >> $DEFCONFIG || true
      - name: Build for d2s
        run: ./workflows.sh -m d2s -k y -r N
      - name: Verify & Package Debug Artifacts
        run: |
          test -f build/out/d2s/boot.img || { echo "boot.img missing"; exit 1; }
          find . -name "vmlinux" -exec cp {} build/out/d2s/vmlinux \;
          find . -name "System.map" -exec cp {} build/out/d2s/System.map \;
          cd build/out/d2s && zip -9 debug-symbols-d2s.zip vmlinux System.map
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d2s
          path: build/out/d2s/*.zip
          if-no-files-found: error

  build_d2x:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2x' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Inject Static Analysis & Strict Debug Configs
        run: |
          DEFCONFIG="arch/arm64/configs/exynos9820-d2x_defconfig"
          echo "CONFIG_DEBUG_BUGVERBOSE=y" >> $DEFCONFIG || true
          echo "CONFIG_PANIC_ON_OOPS=y" >> $DEFCONFIG || true
          echo "CONFIG_FRAME_POINTER=y" >> $DEFCONFIG || true
          echo "CONFIG_DEBUG_SECTION_MISMATCH=y" >> $DEFCONFIG || true
      - name: Build for d2x
        run: ./workflows.sh -m d2x -k y -r N
      - name: Verify & Package Debug Artifacts
        run: |
          test -f build/out/d2x/boot.img || { echo "boot.img missing"; exit 1; }
          find . -name "vmlinux" -exec cp {} build/out/d2x/vmlinux \;
          find . -name "System.map" -exec cp {} build/out/d2x/System.map \;
          cd build/out/d2x && zip -9 debug-symbols-d2x.zip vmlinux System.map
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d2x
          path: build/out/d2x/*.zip
          if-no-files-found: error

  build_d2xks:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd2xks' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Inject Static Analysis & Strict Debug Configs
        run: |
          DEFCONFIG="arch/arm64/configs/exynos9820-d2xks_defconfig"
          echo "CONFIG_DEBUG_BUGVERBOSE=y" >> $DEFCONFIG || true
          echo "CONFIG_PANIC_ON_OOPS=y" >> $DEFCONFIG || true
          echo "CONFIG_FRAME_POINTER=y" >> $DEFCONFIG || true
          echo "CONFIG_DEBUG_SECTION_MISMATCH=y" >> $DEFCONFIG || true
      - name: Build for d2xks
        run: ./workflows.sh -m d2xks -k Y -r N
      - name: Verify & Package Debug Artifacts
        run: |
          test -f build/out/d2xks/boot.img || { echo "boot.img missing"; exit 1; }
          find . -name "vmlinux" -exec cp {} build/out/d2xks/vmlinux \;
          find . -name "System.map" -exec cp {} build/out/d2xks/System.map \;
          cd build/out/d2xks && zip -9 debug-symbols-d2xks.zip vmlinux System.map
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d2xks
          path: build/out/d2xks/*.zip
          if-no-files-found: error

  release:
    needs: [setup, build_d1, build_d1xks, build_d2s, build_d2x, build_d2xks]
    if: ${{ needs.setup.outputs.should_build_all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.setup.outputs.ksu_tag }}-${{ needs.setup.outputs.build_date }}-${{ github.run_number }}
          name: "ExtremeKRNL-Nexus — KernelSU-Next ${{ needs.setup.outputs.ksu_tag }} (${{ needs.setup.outputs.build_date }})"
          body: |
            Automated build. KernelSU-Next pinned to `${{ needs.setup.outputs.ksu_tag }}`.
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
