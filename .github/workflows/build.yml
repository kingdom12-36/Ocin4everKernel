name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build (leave empty to build all)"
        required: false
        default: "all"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should_build_all: ${{ github.event.inputs.model == 'all' }}
      ksu_tag: ${{ steps.ksu_version.outputs.tag }}
      build_date: ${{ steps.ksu_version.outputs.date }}
      ksu_commits: ${{ steps.ksu_version.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
      - name: Set should_build_all output
        run: echo "should_build_all=${{ github.event.inputs.model == 'all' }}" >> $GITHUB_OUTPUT
      - name: Resolve pinned KernelSU-Next version
        id: ksu_version
        run: |
          cd KernelSU-Next
          
          # جلب كل التاجات والتاريخ الكامل للمستودع الفرعي من المطور الأصلي
          git fetch --unshallow || git fetch --tags
          
          # جلب التاج الحالي والـ SHA الخاص بالكوميت
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo unknown)
          SHA=$(git rev-parse --short HEAD)
          
          # حساب عدد الكوميتات من المطور الأصلي بعد تحديث التاريخ
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          
          echo "Pinned KernelSU-Next submodule: $TAG ($SHA)"
          echo "Submodule Commit Count: $COMMIT_COUNT"
          
          # حفظ البيانات كـ Outputs
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT
          echo "commits=$COMMIT_COUNT" >> $GITHUB_OUTPUT


  build_d1:
    needs: setup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'd1' || needs.setup.outputs.should_build_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Build for d1
        env:
          KSU_NEXT_VERSION: ${{ needs.setup.outputs.ksu_commits }}
          KSU_VERSION: ${{ needs.setup.outputs.ksu_commits }}
        run: ./workflows.sh -m d1 -k Y -r N
      - name: Verify build actually produced a flashable package
        run: |
          test -f build/out/d1/boot.img || { echo "boot.img missing - build did not complete"; exit 1; }
          ls build/out/d1/*.zip || { echo "no flashable zip found in build/out/d1"; exit 1; }
      - name: Compress vmlinux for Debugging
        run: |
          VMLINUX=$(find build/out/d1 . -maxdepth 6 -name "vmlinux" -not -name "*.o" -type f 2>/dev/null | head -1)
          if [ -z "$VMLINUX" ]; then
            VMLINUX=$(find . -maxdepth 10 -name "vmlinux" -not -name "*.o" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$VMLINUX" ]; then
            echo "Found vmlinux at: $VMLINUX"
            tar -cJvf vmlinux-d1.tar.xz "$VMLINUX"
            ls -lh vmlinux-d1.tar.xz
          else
            echo "vmlinux not found - skipping"
          fi
      - name: Upload vmlinux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-d1
          path: vmlinux-d1.tar.xz
          if-no-files-found: warn
          retention-days: 7
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1
          path: build/out/d1/*.zip
          if-no-files-found: error

  build_d1xks:
