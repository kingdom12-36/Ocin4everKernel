name: Fix KSU Symlink Only

on:
  workflow_dispatch:

jobs:
  fix-repo-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH }}

      - name: Recreate Correct Symlink
        run: |
          # 1. حذف الملف التالف والاسم الخاطئ
          rm -rf drivers/Kernelsu drivers/kernelsu

          # 2. إنشاء الرابط الرمزي الصحيح الذي يشير لـ KernelSU-Next
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

      - name: Commit and Push to Current Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add drivers/
          git commit -m "Fix: restore symlink drivers/kernelsu -> ../KernelSU-Next/kernel" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

