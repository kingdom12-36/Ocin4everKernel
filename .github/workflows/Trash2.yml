name: Fetch Minimized Hooks Files

on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout local repository (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download target files directly via API
        run: |
          REPO="kingdom12-36/trash2"
          COMMIT="a54e4fa46c6cc25bcaa055cf14d790194beffed8"
          RAW_BASE="https://raw.githubusercontent.com/${REPO}/${COMMIT}"

          # قائمة الملفات الـ 7 المطلوبة
          FILES=(
            "drivers/input/input.c"
            "fs/devpts/inode.c"
            "fs/exec.c"
            "fs/open.c"
            "fs/read_write.c"
            "fs/stat.c"
            "kernel/reboot.c"
          )

          echo "==> Downloading files directly..."

          for FILE in "${FILES[@]}"; do
            mkdir -p "$(dirname "$FILE")"
            echo "Fetching: $FILE"
            curl -sSL "${RAW_BASE}/${FILE}" -o "$FILE"
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            echo "Changes detected, committing..."
            git commit -m "style: direct overwrite manual hooks files from trash2 commit 6591eda"
            
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          else
            echo "No changes detected. Files are identical."
          fi
