name: Update KernelSU-Next Pointers

on:
  push: 
  workflow_dispatch:

jobs:
  update-ksu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update KernelSU-Next pointers
        run: |
          KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
          KSU_HASH="ba4422f0556e10f40dda1887631d87a18ede4ec5"
          
          echo "=> Updating KernelSU-Next paths to commit $KSU_HASH"
          
          UPDATED=0

          # ---------------------------------------------------------
          # Path 1: KernelSU-Next
          # ---------------------------------------------------------
          if [ -d "KernelSU-Next" ]; then
            echo "Processing KernelSU-Next..."
            cd KernelSU-Next
            git remote add ksu_next $KSU_REPO || true
            git fetch ksu_next $KSU_HASH
            git checkout FETCH_HEAD
            cd ..
            git add KernelSU-Next
            UPDATED=1
          else
            echo "Skipping KernelSU-Next (Directory not found)"
          fi
          
          # ---------------------------------------------------------
          # Path 2: drivers/kernelsu
          # ---------------------------------------------------------
          if [ -d "drivers/kernelsu" ]; then
            echo "Processing drivers/kernelsu..."
            cd drivers/kernelsu
            git remote add ksu_next $KSU_REPO || true
            git fetch ksu_next $KSU_HASH
            git checkout FETCH_HEAD
            cd ../..
            git add drivers/kernelsu
            UPDATED=1
          else
            echo "Skipping drivers/kernelsu (Directory not found)"
          fi

          if [ $UPDATED -eq 0 ]; then
            echo "Error: Neither KernelSU-Next nor drivers/kernelsu directory was found!"
            exit 1
          fi
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --cached --quiet; then
            echo "Changes detected, committing..."
            git commit -m "chore: update KernelSU-Next pointers to ba4422f055"
            
            # جلب التحديثات الأخيرة لتفادي التعارض ثم الدفع
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          else
            echo "No changes detected. Pointers are already at $KSU_HASH."
          fi
