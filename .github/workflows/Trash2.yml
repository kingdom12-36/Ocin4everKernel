name: Fetch SuSFS Raw Files

on:
  push: 
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout local repository (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download target files directly via API
        run: |
          REPO="kingdom12-36/trash2"
          COMMIT="e1f6d7420124577902c3d8541caed0231c4c69d4"
          RAW_BASE="https://raw.githubusercontent.com/${REPO}/${COMMIT}"

          # قائمة الملفات المطلوبة
          FILES=(
            "arch/arm64/configs/ksu.config"
            "fs/Makefile"
            "fs/namei.c"
            "fs/namespace.c"
            "fs/notify/fdinfo.c"
            "fs/proc_namespace.c"
            "fs/proc/base.c"
            "fs/proc/cmdline.c"
            "fs/proc/fd.c"
            "fs/proc/task_mmu.c"
            "fs/readdir.c"
            "fs/stat.c"
            "fs/statfs.c"
            "fs/susfs.c"
            "include/linux/seccomp.h"
            "include/linux/susfs.h"
            "include/linux/susfs_def.h"
            "kernel/kallsyms.c"
            "kernel/sys.c"
            "security/selinux/avc.c"
          )

          echo "==> Downloading files directly..."

          for FILE in "${FILES[@]}"; do
            # إنشاء المجلد إذا لم يكن موجوداً
            mkdir -p "$(dirname "$FILE")"
            
            # تنزيل الملف المباشر واستبداله
            echo "Fetching: $FILE"
            curl -sSL "${RAW_BASE}/${FILE}" -o "$FILE"
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            echo "Changes detected, committing..."
            git commit -m "style: direct overwrite susfs files from trash2 commit e1f6d74"
            
            # سحب التغيرات السريعة قبل الدفع لتفادي التعارض
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          else
            echo "No changes detected. Files are identical."
          fi
