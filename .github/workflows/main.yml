name: Apply SUSFS Patch and Build Kernel

on:
  push:
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FCK_SUBMODULES }} # استخدام توكن الدفع المسجل في secrets

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison ccache git python3 wget

      - name: Download & Smart Apply SUSFS Patch
        env:
          GITHUB_TOKEN: ${{ secrets.FCK_SUBMODULES }}
        run: |
          echo "==> Downloading SUSFS Patch from remote GitHub repository..."
          
          PATCH_URL="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch"
          PATCH_FILE="susfs_patch_to_4.14.patch"

          wget -q "$PATCH_URL" -O "$PATCH_FILE"

          if [ ! -s "$PATCH_FILE" ]; then
            echo "❌ ERROR: Failed to download 'susfs_patch_to_4.14.patch' or file is empty!"
            exit 1
          fi

          echo "✅ Downloaded patch successfully!"
          echo "----------------------------------------"
          echo "==> Auto-creating any missing files/directories from patch..."

          python3 -c "
          import os, re

          patch_path = '$PATCH_FILE'
          with open(patch_path, 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          targets = set()
          matches = re.findall(r'^(?:---|\+\+\+|diff --git a/)\s*a?/([^\s\t]+)', content, re.MULTILINE)
          
          for filepath in matches:
              if filepath != 'dev/null' and not filepath.startswith('b/'):
                  targets.add(filepath)

          print('🔍 Referenced files in patch:')
          for t in sorted(targets):
              print(f'   - {t}')
              dirname = os.path.dirname(t)
              if dirname and not os.path.exists(dirname):
                  os.makedirs(dirname, exist_ok=True)
              if not os.path.exists(t):
                  print(f'   ✨ File missing! Auto-creating blank file: {t}')
                  open(t, 'a').close()
          "

          echo "----------------------------------------"
          echo "==> Applying Patch now..."

          # استخدام --ignore-space-change و --whitespace=fix لتجاوز فروقات الفراغات والـ Header
          if git apply --ignore-space-change --ignore-whitespace "$PATCH_FILE" 2>/dev/null; then
            echo "✅ Patch applies cleanly with whitespace ignore! Applying now..."
            git apply --ignore-space-change --ignore-whitespace "$PATCH_FILE"
          else
            echo "⚠️ Trying with traditional 'patch' tool fallback (Fuzz Mode)..."
            # استخدام أداة patch العادية بـ fuzz=3 التي تستطيع التغاضي عن اختلاف ترتيب الهيدرات
            if patch -p1 --fuzz=3 --ignore-whitespace < "$PATCH_FILE"; then
              echo "✅ Patch applied successfully using patch fallback!"
            else
              echo "⚠️ Fallback to git apply --reject..."
              git apply --reject --ignore-space-change "$PATCH_FILE" || true
              
              REJ_FILES=$(find . -name "*.rej")
              if [ -n "$REJ_FILES" ]; then
                echo "----------------------------------------"
                echo "❌ Conflicts found in the following files:"
                echo "$REJ_FILES"
                for f in $REJ_FILES; do
                  echo "========================================"
                  echo "=== Content of $f ==="
                  echo "========================================"
                  cat "$f"
                done
                exit 1
              fi
            fi
          fi


      - name: Verify Modified Files
        run: |
          echo "==> Modified & Created files list:"
          git status --short

      - name: Build Kernel
        run: |
          echo "==> Starting Kernel Compilation..."
