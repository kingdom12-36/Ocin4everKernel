name: Auto Merge Kernel Changes

on:
  workflow_dispatch:

jobs:
  merge-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@v4
        with:
          repository: 'kingdom12-36/Ocin4everKernel'
          ref: 'Patient'
          fetch-depth: 0
          submodules: 'recursive' # جلب الفرع مع الـ Submodules
          token: ${{ secrets.FCK_SUBMODULES }}

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and Fetch Head Repository
        run: |
          git remote add upstream https://github.com/ExtremeXT/M62-backport.git
          git fetch upstream main

      - name: Force Merge Changes & Fix Submodule Conflict
        run: |
          # محاولة الدمج مع تفضيل التغييرات القادمة من upstream
          git merge upstream/main --allow-unrelated-histories -X theirs -m "Auto-merge update" || true
          
          # في حال وجود تعارض في KernelSU-Next يتم اعتماد النسخة وتحديث الـ Submodule
          git submodule update --init --recursive
          git add KernelSU-Next
          
          # إنهاء الدمج في حال كان هناك تغييرات معلقة
          git commit -m "Auto-merge update and resolved submodule conflicts" || true

      - name: Push Changes Back to Base
        run: |
          git push origin Patient
