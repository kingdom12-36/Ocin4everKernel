name: Disable Debug Configs

on:
  workflow_dispatch:

jobs:
  update-defconfig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH }}

      - name: Disable Watchdogs and Debug Configs
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/exynos9820_defconfig"

          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "Error: $DEFCONFIG_FILE not found!"
            exit 1
          fi

          TARGET_CONFIGS=(
            "CONFIG_AUDITSYSCALL"
            "CONFIG_AUDIT_WATCH"
            "CONFIG_AUDIT_TREE"
            "CONFIG_S3C2410_WATCHDOG"
            "CONFIG_EXYNOS_EHLD"
            "CONFIG_SEC_DEBUG_WORKQUEUE_LOCKUP_PANIC"
            "CONFIG_LOCKUP_DETECTOR"
            "CONFIG_SOFTLOCKUP_DETECTOR"
            "CONFIG_HARDLOCKUP_DETECTOR_OTHER_CPU"
            "CONFIG_DETECT_HUNG_TASK"
            "CONFIG_WQ_WATCHDOG"
            "CONFIG_DEBUG_SNAPSHOT_WATCHDOG_RESET"
            "CONFIG_DEBUG_INFO"
            "CONFIG_SCHED_DEBUG"
            "CONFIG_DEBUG_ATOMIC_SLEEP"
            "CONFIG_DEBUG_LIST"
            "CONFIG_TRACING_EVENTS_GPIO"
          )

          for cfg in "${TARGET_CONFIGS[@]}"; do
            if grep -q "^${cfg}=y" "$DEFCONFIG_FILE"; then
              echo "[Modifying] $cfg -> # $cfg is not set"
              sed -i "s/^${cfg}=y/# ${cfg} is not set/" "$DEFCONFIG_FILE"
            else
              echo "[Skipping] $cfg is not set to =y"
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add arch/arm64/configs/exynos9820_defconfig
          git commit -m "defconfig: disable debug and lockup detectors" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

