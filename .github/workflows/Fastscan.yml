name: Build Kernel with SuSFS & KernelSU-Next

on:
  workflow_dispatch:
  push:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison ccache zip git clang lld llvm gcc-aarch64-linux-gnu

      - name: Fast Pre-Build Compatibility Check
        run: |
          echo "==========================================="
          echo " 1. Checking Patch Compatibility (Dry-Run) "
          echo "==========================================="
          PATCH_FILE="patches/susfs_patch_to_4.14.patch"
          
          if [ -f "$PATCH_FILE" ]; then
            if ! patch -p1 --dry-run < "$PATCH_FILE"; then
              echo "❌ ERROR: Patch conflicts with kernel source VFS!"
              exit 1
            fi
            echo "✅ Patch dry-run passed!"
          else
            echo "⚠️ Notice: $PATCH_FILE not found, skipping dry-run check."
          fi

          echo "==========================================="
          echo " 2. Verifying SuSFS Header Definitions     "
          echo "==========================================="
          if ! grep -rnq "ND_STATE_LOOKUP_LAST" include/linux/ drivers/kernelsu/ 2>/dev/null; then
            echo "❌ ERROR: ND_STATE_LOOKUP_LAST is missing from headers!"
            echo "💡 Fix: Add #define ND_STATE_LOOKUP_LAST to include/linux/susfs_def.h or susfs.h"
            exit 1
          fi
          echo "✅ Header definitions verified!"

      - name: Generate Kernel Configuration
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. إنشاء الإعداد الافتراضي (استبدل vendor_defconfig باسم defconfig الخاص بنواتك)
          make ARCH=arm64 vendor_defconfig

          # 2. دمج ksu.config في .config
          if [ -f "ksu.config" ]; then
            echo "⚙️ Merging ksu.config into .config..."
            cat ksu.config >> .config
            make ARCH=arm64 olddefconfig
            echo "✅ ksu.config applied successfully!"
          elif [ -f "arch/arm64/configs/ksu.config" ]; then
            echo "⚙️ Merging arch/arm64/configs/ksu.config into .config..."
            cat arch/arm64/configs/ksu.config >> .config
            make ARCH=arm64 olddefconfig
            echo "✅ ksu.config applied successfully!"
          else
            echo "⚠️ Warning: ksu.config not found! Proceeding with base defconfig."
          fi

      - name: Fast Partial Compilation Test
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Testing fs/namei.o compilation..."
          make -j$(nproc) ARCH=arm64 fs/namei.o || { echo "❌ ERROR: fs/namei.c failed to compile!"; exit 1; }
          
          echo "Testing drivers/kernelsu compilation..."
          make -j$(nproc) ARCH=arm64 drivers/kernelsu/ || { echo "❌ ERROR: KernelSU/SuSFS failed to compile!"; exit 1; }
          
          echo "🚀 SUCCESS: Compatibility checks passed!"

      - name: Build Full Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make -j$(nproc) ARCH=arm64 Image.gz-dtb

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz-dtb
