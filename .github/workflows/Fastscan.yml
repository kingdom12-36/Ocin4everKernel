name: Build Kernel with SuSFS & KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison ccache zip git clang lld llvm aarch64-linux-gnu-gcc

      - name: Fast Pre-Build Compatibility Check
        run: |
          echo "==========================================="
          echo " 1. Checking Patch Compatibility (Dry-Run) "
          echo "==========================================="
          # عدّل مسار ملف الرقعة وحسب مجلدك
          PATCH_FILE="patches/susfs_patch_to_4.14.patch"
          
          if [ -f "$PATCH_FILE" ]; then
            if ! patch -p1 --dry-run < "$PATCH_FILE"; then
              echo "❌ ERROR: Patch conflicts with kernel source VFS!"
              exit 1
            fi
            echo "✅ Patch dry-run passed!"
          else
            echo "⚠️ Notice: $PATCH_FILE not found, skipping dry-run check."
          fi

          echo "==========================================="
          echo " 2. Verifying SuSFS Header Definitions     "
          echo "==========================================="
          if ! grep -rnq "ND_STATE_LOOKUP_LAST" include/linux/ drivers/kernelsu/ 2>/dev/null; then
            echo "❌ ERROR: ND_STATE_LOOKUP_LAST is missing from headers!"
            echo "💡 Fix: Add #define ND_STATE_LOOKUP_LAST to include/linux/susfs_def.h or susfs.h"
            exit 1
          fi
          echo "✅ Header definitions verified!"

          echo "==========================================="
          echo " 3. Fast Partial Compilation Test           "
          echo "==========================================="
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # استبدل vendor_defconfig باسم ملف الإعدادات الخاص بنواتك
          make ARCH=arm64 vendor_defconfig

          # تجميع سريع للملفات الحساسة فقط (يستغرق ثوانٍ بدلاً من انتظار البناء الكامل)
          echo "Testing fs/namei.o compilation..."
          make -j$(nproc) ARCH=arm64 fs/namei.o || { echo "❌ ERROR: fs/namei.c failed to compile!"; exit 1; }
          
          echo "Testing drivers/kernelsu compilation..."
          make -j$(nproc) ARCH=arm64 drivers/kernelsu/ || { echo "❌ ERROR: KernelSU/SuSFS failed to compile!"; exit 1; }
          
          echo "🚀 SUCCESS: All compatibility checks passed! Starting full build..."

      - name: Build Full Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make -j$(nproc) ARCH=arm64 Image.gz-dtb

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz-dtb
